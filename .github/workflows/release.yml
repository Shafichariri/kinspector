name: Release

# Publishes the host daemon as a downloadable GitHub Release, so a teammate can run the web UI
# and the MCP server without cloning this repo or installing Gradle.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The same tag also publishes the library modules to GitHub Packages, so a consuming app can
# depend on coordinates instead of needing this repository checked out. Two jobs because they have
# nothing in common: different runners, different outputs, different audiences.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # gh release create
  packages: write # publish to GitHub Packages

jobs:
  daemon:
    # ubuntu, not the macos-latest that CI uses: the daemon is plain JVM, and no Kotlin/Native
    # target is compiled here. Gradle still *configures* the iOS targets -- it just reports them
    # as unsupported on this host, which is harmless because no task in this job needs them.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Configuration-time requirement of the KMP library modules, even though this job builds
      # none of them. Same line as ci.yml.
      - name: Point at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build the distribution
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :inspector-daemon:distZip -Pinspector.version="$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP=inspector-daemon/build/distributions/inspector-$VERSION.zip" >> "$GITHUB_ENV"

      # A zip that does not start is worse than no release, and packaging -- not the code, which
      # CI already covers -- is what this job can break. So run the artifact itself, the way a
      # teammate would: unzip somewhere clean, serve, and ask it for both surfaces.
      - name: Smoke-test the artifact
        run: |
          BIN="$RUNNER_TEMP/dist/inspector-$VERSION/bin/inspector"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/dist"
          "$BIN" serve --port 8123 --data "$RUNNER_TEMP/dist/data" &
          DAEMON_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8123/api/sessions > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8123/api/sessions > /dev/null
          curl -sf http://127.0.0.1:8123/ | grep -q '<title>Inspector</title>'
          kill "$DAEMON_PID"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            | "$BIN" mcp --data "$RUNNER_TEMP/dist/data" \
            | grep -q '"serverInfo"'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "Inspector $VERSION" \
            --notes-file - <<NOTES
          One tag, both halves. This release page carries the **daemon**; the same version of the
          **library** went to GitHub Packages from the job beside this one. There is no separate
          daemon version and library version.

          A release does not always change both halves — see \`docs/INTEGRATION.md\` section 14,
          which says per version what changed and what you have to do about it.

          ### Daemon — web UI, session archive, CLI, MCP server

          **Requires JDK 21.** Nothing else: the zip carries its own dependencies, and no account
          is needed to download it.

          \`\`\`bash
          gh release download $GITHUB_REF_NAME --repo $GITHUB_REPOSITORY --pattern '*.zip'
          unzip inspector-$VERSION.zip
          ./inspector-$VERSION/bin/inspector serve
          \`\`\`

          It binds \`127.0.0.1\` only and never calls out.

          ### Library — capture and the in-app overlay

          Seven modules at \`$VERSION\`, from GitHub Packages. That registry wants an
          authenticated token even for public packages, which surprises people — \`docs/ACCESS.md\`
          leads with it.

          \`\`\`kotlin
          implementation("io.github.shafichariri:inspector-core:$VERSION")
          implementation("io.github.shafichariri:inspector-ui:$VERSION")
          implementation("io.github.shafichariri:inspector-stream:$VERSION")
          \`\`\`
          NOTES

  library:
    # macOS, unlike the daemon job: the iOS klibs can only be produced on a Mac. A publication
    # missing its iOS variants is worse than no publication -- it resolves on JVM and Android and
    # then fails on device, at the point furthest from the cause.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Point at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # The seven library modules, each as a root metadata module plus one variant per target.
      # GITHUB_TOKEN carries packages:write from the permissions block above, so no personal
      # token is involved in publishing -- only in *consuming*, which GitHub requires separately.
      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew publishAllPublicationsToGitHubPackagesRepository \
            -Pinspector.version="${GITHUB_REF_NAME#v}"
