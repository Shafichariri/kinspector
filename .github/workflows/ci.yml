name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # macOS because the iOS targets need Xcode. The Kotlin/Native klib scan in the release
    # guard is only meaningful on a runner that can actually produce those artifacts.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Point at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build all modules and targets
        run: ./gradlew build

      - name: Test — JVM
        run: ./gradlew :inspector-model:jvmTest :inspector-core:jvmTest :inspector-noop:jvmTest

      - name: Test — iOS simulator
        run: ./gradlew :inspector-model:iosSimulatorArm64Test

      - name: Test — Android host
        run: ./gradlew :inspector-model:testAndroidHostTest

      # Two directions, deliberately. The self-test proves the detector can find the canary at
      # all; without it, a broken detector would report every release build clean.
      - name: Release guard — self-test (canary must be detectable)
        run: ./scripts/check-release-clean.sh --self-test

      - name: Release guard — noop must be clean
        run: ./scripts/check-release-clean.sh

      # --paths over what a consumer downloads, which neither step above scans. A published klib
      # is a zip: core's own read as clean until the guard unpacked klibs. A deep path once made a
      # temp name too long, and the mkdir error exited 1, "canary found". Each case pins its exit
      # code, so a regression either way fails here and not at a consumer's release.
      - name: Release guard — packed klibs, deep paths, unreadable archives, internal errors
        run: |
          ./gradlew :inspector-core:iosArm64Klib :inspector-noop:iosArm64Klib
          expect() {
            want="$1"; shift
            got=0; ./scripts/check-release-clean.sh "$@" || got=$?
            [ "$got" = "$want" ] || { echo "::error::expected exit $want, got $got: $*"; exit 1; }
          }
          deep="$RUNNER_TEMP/$(printf 'd%.0s' $(seq 200))/$(printf 'e%.0s' $(seq 200))"
          mkdir -p "$deep/core" "$deep/noop" "$RUNNER_TEMP/stub"
          cp inspector-core/build/libs/inspector-core-iosArm64Main-*.klib "$deep/core/"
          cp inspector-noop/build/libs/inspector-noop-iosArm64Main-*.klib inspector-noop/build/libs/inspector-noop-jvm-*.jar "$deep/noop/"
          cp -R inspector-core/build/classes/kotlin/iosArm64/main/klib "$deep/unpacked.klib"
          expect 1 --paths inspector-core/build/libs/inspector-core-iosArm64Main-*.klib
          expect 0 --paths inspector-noop/build/libs/inspector-noop-iosArm64Main-*.klib
          expect 1 --paths "$deep/core"
          expect 0 --paths "$deep/noop"
          expect 1 --paths "$deep/unpacked.klib"
          printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/stub/mktemp"
          chmod +x "$RUNNER_TEMP/stub/mktemp"
          PATH="$RUNNER_TEMP/stub:$PATH" expect 2 --paths "$deep/noop"
          # An archive unzip cannot open once unpacked to an empty folder and read as clean, so
          # half of core's own jar passed. Exit 2: nothing was proven.
          jar="$(ls inspector-core/build/libs/inspector-core-jvm-*.jar | grep -v -e sources -e javadoc | head -1)"
          head -c "$(( $(wc -c < "$jar") / 2 ))" "$jar" > "$RUNNER_TEMP/truncated.jar"
          printf 'not a zip\n' > "$RUNNER_TEMP/text.klib"
          expect 2 --paths "$RUNNER_TEMP/truncated.jar"
          expect 2 --paths "$RUNNER_TEMP/text.klib"

      # A CI-only failure is diagnosed from CI or not at all. The console log carries the assertion
      # message; these reports carry the full per-test output and stack traces.
      - name: Keep test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-build
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  web:
    # The web UI's checks, which for most of the project's life ran only when somebody remembered.
    # Linux, because nothing here builds an iOS or Android artifact: the daemon is a JVM module and
    # the probes are Node. Static checks run before Gradle so a broken mirror fails in seconds.
    runs-on: ubuntu-latest
    env:
      # Pinned, and named in both probe scripts' headers. A jsdom upgrade changes what the probes
      # can observe, so it is a change to make on purpose, not one a fresh install makes for us.
      JSDOM_VERSION: '29.1.1'
      # How many checks each probe must pass against the fixture session. A probe that stops
      # running reports less rather than failing; these numbers are what notice. Update them in
      # the same change that adds or removes a check.
      UI_EXPECT_CHECKS: '325'
      ARCHIVE_EXPECT_CHECKS: '61'
      # Never 8099: that is the port every consuming app dials by default.
      PROBE_PORT: '8231'

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Point at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Static web checks — network call sites, stylesheet audits, parser, mirror cases
        run: node scripts/check-web-static.js

      # The landing page in a 400 px window. Chrome is the runner image's own (/usr/bin/google-chrome,
      # found by scripts/lib/measure-cdp.js): nothing is installed for it, and `site` starts no daemon,
      # so it runs before Gradle. See docs/decisions/web-ui.md on the landing page's grid items.
      - name: Landing page fits a 400 px window
        run: node scripts/measure-web-ui.js --only site

      - name: Build the daemon and write the probe session
        run: >-
          ./gradlew :inspector-daemon:installDist :inspector-daemon:writeProbeFixture
          -Pinspector.probeDir="$RUNNER_TEMP/probe"

      - name: Start the daemon on the probe session
        run: |
          inspector-daemon/build/install/inspector/bin/inspector serve \
            --data "$RUNNER_TEMP/probe" --port "$PROBE_PORT" > "$RUNNER_TEMP/daemon.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/daemon.pid"
          for i in $(seq 1 60); do
            curl -sf "http://127.0.0.1:$PROBE_PORT/api/sessions" > /dev/null && exit 0
            sleep 1
          done
          echo "daemon did not answer within 60s"; cat "$RUNNER_TEMP/daemon.log"; exit 1

      # The findings gate on the installed launcher, the binary a consuming team runs, so this also
      # proves bin/inspector passes the JVM's exit code through. Exact codes, not "non-zero": 2 means
      # it could not judge, and a gate that read 2 here would be a broken setup passing as a finding.
      # The payments session holds three high findings; the base session holds none at any severity.
      - name: Findings gate exits 1 on a high finding and 0 on none
        run: |
          inspector=inspector-daemon/build/install/inspector/bin/inspector
          set +e
          "$inspector" findings --data "$RUNNER_TEMP/probe" --session 2025-12-31T08-00-00_probe-payments_ci_debug \
            --fail-on high > /dev/null
          payments=$?
          "$inspector" findings --data "$RUNNER_TEMP/probe" --session 2025-12-30T09-00-00_probe_ci_debug \
            --fail-on high > /dev/null
          base=$?
          set -e
          echo "payments session: exit $payments (want 1); base session: exit $base (want 0)"
          [ "$payments" -eq 1 ] && [ "$base" -eq 0 ]

      - name: Install jsdom
        run: npm install --no-save --no-package-lock "jsdom@$JSDOM_VERSION"

      - name: Live web UI probe
        env:
          INSPECTOR_UI_ORIGIN: http://127.0.0.1:${{ env.PROBE_PORT }}
          INSPECTOR_UI_EXPECT_CHECKS: ${{ env.UI_EXPECT_CHECKS }}
        run: node scripts/render-web-ui.js > "$RUNNER_TEMP/ui.html"

      - name: Exported session probe
        env:
          INSPECTOR_UI_ARCHIVE: ${{ runner.temp }}/s.html
          # The fixture's 1203-call session, past the route's clamp; see scripts/lib/long-session-probes.js.
          INSPECTOR_UI_ARCHIVE_LONG: ${{ runner.temp }}/long.html
          # The fixture's payments session, whose findings the Findings page draws; see scripts/lib/findings-probes.js.
          INSPECTOR_UI_ARCHIVE_PAYMENTS: ${{ runner.temp }}/payments.html
          INSPECTOR_UI_EXPECT_CHECKS: ${{ env.ARCHIVE_EXPECT_CHECKS }}
        run: |
          curl -sf "http://127.0.0.1:$PROBE_PORT/api/sessions/latest/export.html" -o "$INSPECTOR_UI_ARCHIVE"
          curl -sf "http://127.0.0.1:$PROBE_PORT/api/sessions/2025-12-31T09-00-00_probe-long_ci_debug/export.html" -o "$INSPECTOR_UI_ARCHIVE_LONG"
          curl -sf "http://127.0.0.1:$PROBE_PORT/api/sessions/2025-12-31T08-00-00_probe-payments_ci_debug/export.html" -o "$INSPECTOR_UI_ARCHIVE_PAYMENTS"
          node scripts/render-web-ui-archive.js

      # The snapshots are what a person reads when a probe goes red here; keep them either way.
      - name: Keep the snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-ui-snapshots
          path: |
            ${{ runner.temp }}/ui.html
            ${{ runner.temp }}/s.html
            ${{ runner.temp }}/long.html
            ${{ runner.temp }}/daemon.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop the daemon
        if: always()
        run: if [ -f "$RUNNER_TEMP/daemon.pid" ]; then kill "$(cat "$RUNNER_TEMP/daemon.pid")" || true; fi

  repo:
    # Checks on the commits and the tree that need no JDK: who authored the commits being added,
    # and whether anything names a client. Ubuntu, a full clone, about twenty seconds.
    #
    # Refs reach the scripts through `env:`, never as `${{ }}` inside `run:` -- a branch name is
    # text a contributor chose, and interpolating it into a shell line would execute it. And this
    # workflow stays on `pull_request`, never `pull_request_target`, so a fork's code never runs
    # with this repository's secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Both ends of the range must be present, and a shallow clone has only one.
          fetch-depth: 0

      - name: Commit identity — maintainer's noreply or personal address, no attribution trailers
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/check-commit-identity.sh "$BASE" "$HEAD"

      # The terms are a repository secret and never in the repository. An unset secret arrives as
      # an empty string, and so does every secret on a fork's pull request; the script then says
      # NOT RUN with a warning rather than printing a pass. On a push to main the secret exists, so
      # `--require-terms` makes a missing or emptied secret fail instead of warning: a scan that
      # silently stopped running would otherwise leave main green forever. Pull requests keep the
      # warning, because a fork's pull request never receives secrets.
      # It runs even when the identity step above failed: a bad merge author once skipped it, so
      # main went a push without its name scan, and the two checks answer different questions.
      - name: Client names — tree, commit messages, branch name
        if: success() || failure()
        env:
          CLIENT_NAME_TERMS: ${{ secrets.CLIENT_NAME_TERMS }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          REQUIRE: ${{ github.event_name == 'push' && '--require-terms' || '' }}
        run: ./scripts/check-client-names.sh --range "$BASE..$HEAD" --branch "$BRANCH" $REQUIRE

  release-swap:
    # Proves -Pinspector=off is wired end to end, independently of the artifact scan above.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build with capture disabled
        run: ./gradlew build -Pinspector=off

      - name: Keep test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-release-swap
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: ignore
