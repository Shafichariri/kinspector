org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official
# 3g was not enough once an iOS *framework* had to be linked rather than just a klib: linking
# the Compose runtime into one binary is the heaviest thing this build does, and it failed with
# "Compilation failed: Java heap space" in the Kotlin daemon.
kotlin.daemon.jvmargs=-Xmx5g

android.useAndroidX=true

# Set to "off" in release builds to swap :inspector-core for :inspector-noop.
# See plan §8 and scripts/check-release-clean.sh.
inspector=on
